# Vhost do CipherShare no Nginx do host (servidor labit.dev.br).
#
# Instalação:
#     sudo cp deploy/ciphershare.labit.dev.br.conf /etc/nginx/conf.d/ciphershare.conf
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo certbot --nginx -d ciphershare.labit.dev.br
#
# O certbot reescreve este arquivo sozinho: acrescenta o `listen 443 ssl` com
# os certificados e cria um segundo bloco redirecionando a porta 80. É por isso
# que aqui só existe o bloco 80 — é o estado "antes do certbot", igual ao que
# os outros projetos do servidor tiveram antes de serem convertidos.

server {
    listen 80;
    listen [::]:80;
    server_name ciphershare.labit.dev.br;

    # --- Limite de corpo -------------------------------------------------
    # 100 MiB de cifra mais folga para o envelope multipart, igual ao limite do
    # Nginx do contêiner. Os vizinhos deste servidor usam 100M, que aqui
    # cortaria um arquivo no tamanho máximo.
    client_max_body_size 101m;

    location / {
        # HTTPS, e não HTTP, de propósito: a porta 443 do contêiner é a que
        # carrega a CSP, o HSTS e o rate limit. A porta 80 dele apenas
        # redireciona, o que atrás de um proxy viraria laço infinito.
        #
        # O certificado do outro lado é autoassinado e o Nginx não o verifica
        # (proxy_ssl_verify é off por padrão). Isso é aceitável porque o salto
        # inteiro acontece dentro do loopback da máquina.
        proxy_pass https://127.0.0.1:8443/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        # --- Streaming --------------------------------------------------
        # Sem isto, o Nginx do host acumularia o upload inteiro em disco antes
        # de repassá-lo. Com arquivos de 100 MB e o disco deste servidor em
        # 66% de uso, é a diferença entre transmitir e encher a partição.
        proxy_request_buffering off;
        proxy_buffering off;

        # Arquivos grandes em conexões lentas não cabem nos 60s padrão.
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
