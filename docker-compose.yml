# Ambiente completo do MVP: proxy reverso, API, banco e object storage.
#
# Subida a partir de uma máquina limpa:
#     cp .env.example .env
#     docker compose up --build

services:
  nginx:
    build: ./nginx
    depends_on:
      - api
    ports:
      # Portas do host configuráveis para conviver com outros serviços locais.
      # O HTTP existe só para redirecionar ao HTTPS.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Os arquivos estáticos são montados, não copiados: editar uma tela não
      # exige reconstruir imagem nenhuma.
      - ./static:/usr/share/nginx/html:ro
      - nginx_certs:/etc/nginx/certs
    restart: unless-stopped

  api:
    build: ./api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Sem mapeamento de porta para o host: todo acesso passa pelo Nginx.
    expose:
      - "8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # Console web do MinIO, útil em desenvolvimento para conferir que o
      # servidor guarda mesmo bytes ilegíveis.
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Suíte de testes. Não sobe com o `docker compose up`: roda sob demanda com
  #     docker compose --profile test run --rm tests
  tests:
    build: ./tests
    profiles: ["test"]
    env_file:
      - .env
    environment:
      # Os testes falam com o sistema pelo Nginx, em HTTPS, como um usuário.
      BASE_URL: https://nginx
    volumes:
      - ./tests:/work/tests:ro
      - ./static:/work/static:ro
      - ./cofre.py:/work/cofre.py:ro
      # O código da API é montado para que os testes de expiração exercitem o
      # job real, em vez de uma reimplementação.
      - ./api:/work/api:ro
    depends_on:
      - nginx
      - api
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
  nginx_certs:
