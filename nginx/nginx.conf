# Proxy reverso e servidor dos arquivos estáticos.
#
# Três responsabilidades: encerrar o TLS, aplicar os cabeçalhos de segurança e
# limitar o que chega à API — tamanho de corpo e taxa de requisições por IP.

# O log de acesso não pode registrar o localizador completo (seção 7 do plano).
# Este map reescreve o caminho antes de ele ser gravado, deixando visíveis
# apenas os oito primeiros caracteres — o bastante para correlacionar eventos,
# insuficiente para reconstruir o endereço de um arquivo.
map $request_uri $caminho_mascarado {
    "~^(?<prefixo>/api/files/)(?<inicio>[0-9a-f]{8})[0-9a-f]{56}(?<sufixo>.*)$" "${prefixo}${inicio}...${sufixo}";
    default $request_uri;
}

log_format mascarado '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $caminho_mascarado $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Zonas de rate limiting, por endereço de origem. Os valores são folgados: o
# objetivo é conter varredura automatizada de localizadores e enxurrada de
# uploads, não atrapalhar uso legítimo.
limit_req_zone $binary_remote_addr zone=api_leitura:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_envio:10m rate=5r/s;
limit_req_status 429;

# HTTP existe apenas para mandar todo mundo para o HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log mascarado;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access.log mascarado;

    # --- TLS -----------------------------------------------------------
    # Certificado autoassinado, gerado na subida do contêiner. Em produção,
    # troque por um certificado emitido por uma autoridade reconhecida.
    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;

    # Apenas TLS 1.3: sem versões antigas, sem negociação de cifras fracas.
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # --- Cabeçalhos de segurança ---------------------------------------
    # Todos declarados aqui, no nível do servidor, e em nenhum bloco location:
    # no Nginx, um add_header dentro de location substitui os herdados, e essa
    # pegadinha já custou muita gente uma CSP silenciosamente ausente.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # A CSP não permite 'unsafe-inline' em lugar nenhum: todo o JavaScript e
    # todo o CSS vivem em arquivos externos, e não há um único atributo onclick
    # nos documentos HTML. É esta linha que transforma essa disciplina em
    # garantia — um script injetado na página simplesmente não executa.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Nada de cache: a aplicação é pequena e a atualização do JavaScript é
    # justamente o que não pode ficar para trás numa página que manipula chaves.
    add_header Cache-Control "no-store" always;

    # --- Limite de corpo ------------------------------------------------
    # 100 MiB de cifra mais folga para o envelope multipart. A aplicação
    # confere o limite de novo, por si mesma: o proxy é a primeira barreira,
    # nunca a única.
    client_max_body_size 101m;

    # --- Arquivos estáticos ---------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # --- API -------------------------------------------------------------
    location /api/files {
        limit_req zone=api_envio burst=30 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        limit_req zone=api_leitura burst=60 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
}
