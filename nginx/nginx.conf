# Proxy reverso. Nesta fase ele só encaminha /api para o FastAPI; o TLS, os
# cabeçalhos de segurança e o rate limiting entram na Fase 6.

server {
    listen 80;
    server_name _;

    # Não anunciar a versão do Nginx nas respostas e nas páginas de erro.
    server_tokens off;

    # Limite de corpo da requisição: 100 MiB de cifra mais uma folga para o
    # envelope multipart. A aplicação confere o limite de novo, por si mesma —
    # o Nginx é a primeira barreira, nunca a única.
    client_max_body_size 101m;

    location /api/ {
        proxy_pass http://api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads e downloads são transmitidos em streaming: o Nginx não deve
        # acumular o arquivo inteiro em disco antes de repassá-lo.
        proxy_request_buffering off;
        proxy_buffering off;

        # Arquivos grandes em conexões lentas precisam de mais que os 60s
        # padrão para terminar a transferência.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
